<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Automation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>📲 WhatsApp Message Sender</h1>

    <form action="/send" method="POST">

        <label>Phone Number (with country code)</label>
        <input type="text" name="number" placeholder="+91xxxxxxxxxx" required>

        <label>Message</label>
        <textarea name="message" placeholder="Type your message..." required></textarea>

        <label>Hour (24 format)</label>
        <input type="number" name="hour" min="0" max="23" required>

        <label>Minute</label>
        <input type="number" name="minute" min="0" max="59" required>

        <button type="submit">Send Message 🚀</button>

    </form>
</div>

</body>
</html>
